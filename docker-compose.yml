# ============================================================
# docker-compose.yml — Estreito de Ormuz P3
#
# Serviços:
#   4 brokers  (cluster distribuído com blockchain P2P)
#   4 drones   (frota compartilhada)
#   8 sensores (2 por setor)
#   1 client   (terminal de comando interativo)
#   1 tester   (tester de latência e RA — Daniel)
#
# Pré-requisito: executar ./gen-certs.sh uma vez antes do build.
#
# Uso:
#   docker-compose up --build          # sobe tudo
#   docker-compose up --build broker1  # sobe só um broker
#   docker attach ormuz-p3-client-1    # acessa o terminal do cliente
#   docker attach ormuz-p3-tester-1    # acessa o terminal do tester
# ============================================================

networks:
  ormuz-net:
    driver: bridge

# Volumes persistentes por broker (estado local da chain + fila)
volumes:
  state-broker1:
  state-broker2:
  state-broker3:
  state-broker4:

services:

  # ==========================================================
  # BROKERS — um nó do cluster por setor marítimo
  # Cada broker é simultaneamente:
  #   - servidor de ocorrências (sensores/clientes conectam aqui)
  #   - peer do cluster (Ricart-Agrawala entre brokers)
  #   - nó da blockchain (propõe e valida blocos PoA)
  # ==========================================================

  broker1:
    build:
      context: .
      dockerfile: Dockerfile.broker
    command: ["1"]
    environment:
      CONFIG_PATH: /app/config.json
      STATE_DIR: /app/state
    volumes:
      - state-broker1:/app/state
      - ./config.json:/app/config.json:ro
    networks:
      - ormuz-net
    ports:
      - "0.0.0.0:9081:9081"
    restart: on-failure

  broker2:
    build:
      context: .
      dockerfile: Dockerfile.broker
    command: ["2"]
    environment:
      CONFIG_PATH: /app/config.json
      STATE_DIR: /app/state
    volumes:
      - state-broker2:/app/state
      - ./config.json:/app/config.json:ro
    networks:
      - ormuz-net
    ports:
      - "0.0.0.0:9082:9082"
    restart: on-failure

  broker3:
    build:
      context: .
      dockerfile: Dockerfile.broker
    command: ["3"]
    environment:
      CONFIG_PATH: /app/config.json
      STATE_DIR: /app/state
    volumes:
      - state-broker3:/app/state
      - ./config.json:/app/config.json:ro
    networks:
      - ormuz-net
    ports:
      - "0.0.0.0:9083:9083"
    restart: on-failure

  broker4:
    build:
      context: .
      dockerfile: Dockerfile.broker
    command: ["4"]
    environment:
      CONFIG_PATH: /app/config.json
      STATE_DIR: /app/state
    volumes:
      - state-broker4:/app/state
      - ./config.json:/app/config.json:ro
    networks:
      - ormuz-net
    ports:
      - "0.0.0.0:9084:9084"
    restart: on-failure
    
  broker5:
    build:
      context: .
      dockerfile: Dockerfile.broker
    command: [ "5" ]
    environment:
      CONFIG_PATH: /app/config.json
      STATE_DIR: /app/state
      MALICIOUS: "true"  # <--- Ativa o comportamento vilão/hacker
    volumes:
      - state-broker5:/app/state
      - ./config.json:/app/config.json:ro
    networks:
      - ormuz-net
    ports:
      - "0.0.0.0:9085:9085"
    restart: on-failure

  # ==========================================================
  # DRONES — frota compartilhada entre setores
  # Cada drone conecta-se ao broker do seu setor por padrão,
  # mas faz fallback para os outros brokers se o seu cair.
  # ==========================================================

  drone1:
    build:
      context: .
      dockerfile: Dockerfile.drone
    command: ["drone1", "drone1:9091", "broker1:9081"]
    environment:
      CONFIG_PATH: /app/config.json
    volumes:
      - ./config.json:/app/config.json:ro
    networks:
      - ormuz-net
    ports:
      - "9091:9091"
    depends_on:
      - broker1
    restart: on-failure

  drone2:
    build:
      context: .
      dockerfile: Dockerfile.drone
    command: ["drone2", "drone2:9092", "broker2:9082"]
    environment:
      CONFIG_PATH: /app/config.json
    volumes:
      - ./config.json:/app/config.json:ro
    networks:
      - ormuz-net
    ports:
      - "9092:9092"
    depends_on:
      - broker2
    restart: on-failure

  drone3:
    build:
      context: .
      dockerfile: Dockerfile.drone
    command: ["drone3", "drone3:9093", "broker3:9083"]
    environment:
      CONFIG_PATH: /app/config.json
    volumes:
      - ./config.json:/app/config.json:ro
    networks:
      - ormuz-net
    ports:
      - "9093:9093"
    depends_on:
      - broker3
    restart: on-failure

  drone4:
    build:
      context: .
      dockerfile: Dockerfile.drone
    command: ["drone4", "drone4:9094", "broker4:9084"]
    environment:
      CONFIG_PATH: /app/config.json
    volumes:
      - ./config.json:/app/config.json:ro
    networks:
      - ormuz-net
    ports:
      - "9094:9094"
    depends_on:
      - broker4
    restart: on-failure

  # ==========================================================
  # SENSORES — detectores automáticos de incidentes
  # 2 sensores por setor. Intervalos configuráveis via env var.
  # SENSOR_INTERVALO_MIN/MAX controlam o ritmo de geração (segundos).
  # ==========================================================

  # Setor 1
  sensor-s1a:
    build:
      context: .
      dockerfile: Dockerfile.sensor
    command: ["S1A", "setor-1", "broker1:9081"]
    environment:
      SENSOR_INTERVALO_MIN: "15"
      SENSOR_INTERVALO_MAX: "20"
    networks:
      - ormuz-net
    depends_on:
      - broker1
    restart: on-failure

  sensor-s1b:
    build:
      context: .
      dockerfile: Dockerfile.sensor
    command: ["S1B", "setor-1", "broker1:9081"]
    environment:
      SENSOR_INTERVALO_MIN: "12"
      SENSOR_INTERVALO_MAX: "18"
    networks:
      - ormuz-net
    depends_on:
      - broker1
    restart: on-failure

  # Setor 2
  sensor-s2a:
    build:
      context: .
      dockerfile: Dockerfile.sensor
    command: ["S2A", "setor-2", "broker2:9082"]
    environment:
      SENSOR_INTERVALO_MIN: "15"
      SENSOR_INTERVALO_MAX: "20"
    networks:
      - ormuz-net
    depends_on:
      - broker2
    restart: on-failure

  sensor-s2b:
    build:
      context: .
      dockerfile: Dockerfile.sensor
    command: ["S2B", "setor-2", "broker2:9082"]
    environment:
      SENSOR_INTERVALO_MIN: "15"
      SENSOR_INTERVALO_MAX: "20"
    networks:
      - ormuz-net
    depends_on:
      - broker2
    restart: on-failure

  # Setor 3
  sensor-s3a:
    build:
      context: .
      dockerfile: Dockerfile.sensor
    command: ["S3A", "setor-3", "broker3:9083"]
    environment:
      SENSOR_INTERVALO_MIN: "20"
      SENSOR_INTERVALO_MAX: "25"
    networks:
      - ormuz-net
    depends_on:
      - broker3
    restart: on-failure

  sensor-s3b:
    build:
      context: .
      dockerfile: Dockerfile.sensor
    command: ["S3B", "setor-3", "broker3:9083"]
    environment:
      SENSOR_INTERVALO_MIN: "10"
      SENSOR_INTERVALO_MAX: "15"
    networks:
      - ormuz-net
    depends_on:
      - broker3
    restart: on-failure

  # Setor 4
  sensor-s4a:
    build:
      context: .
      dockerfile: Dockerfile.sensor
    command: ["S4A", "setor-4", "broker4:9084"]
    environment:
      SENSOR_INTERVALO_MIN: "16"
      SENSOR_INTERVALO_MAX: "22"
    networks:
      - ormuz-net
    depends_on:
      - broker4
    restart: on-failure

  sensor-s4b:
    build:
      context: .
      dockerfile: Dockerfile.sensor
    command: ["S4B", "setor-4", "broker4:9084"]
    environment:
      SENSOR_INTERVALO_MIN: "10"
      SENSOR_INTERVALO_MAX: "15"
    networks:
      - ormuz-net
    depends_on:
      - broker4
    restart: on-failure

  # ==========================================================
  # CLIENT — terminal de comando interativo (Felipe)
  # Permite injetar ocorrências manualmente com companhia + créditos.
  # Uso: docker attach ormuz-p3-client-1
  # ==========================================================
  client:
    build:
      context: .
      dockerfile: Dockerfile.client
    command: ["broker1:9081"]
    networks:
      - ormuz-net
    depends_on:
      - broker1
    stdin_open: true
    tty: true

  # ==========================================================
  # TESTER — ferramenta de diagnóstico e stress-test (Daniel)
  # Mede latência RTT, simula múltiplas companhias, exibe RA em tempo real.
  # Uso: docker attach ormuz-p3-tester-1
  # ==========================================================
  tester:
    build:
      context: .
      dockerfile: Dockerfile.tester
    command: ["broker1:9081", "broker2:9082", "broker3:9083", "broker4:9084"]
    networks:
      - ormuz-net
    depends_on:
      - broker1
      - broker2
      - broker3
      - broker4
    stdin_open: true
    tty: true