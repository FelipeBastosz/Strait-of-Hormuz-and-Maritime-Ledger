networks:
  ormuz-net:
    driver: bridge

volumes:
  state-broker1:
  state-broker2:

services:
  # ── BROKERS (PC 1) ────────────────────────────────────────
  broker1:
    build:
      context: .
      dockerfile: Dockerfile.broker
    command: ["1"]
    environment:
      CONFIG_PATH: /app/config.json
      STATE_DIR: /app/state
    volumes:
      - state-broker1:/app/state
      - ./config.json:/app/config.json:ro
    networks:
      - ormuz-net
    ports:
      - "9081:9081"
    restart: on-failure

  broker2:
    build:
      context: .
      dockerfile: Dockerfile.broker
    command: ["2"]
    environment:
      CONFIG_PATH: /app/config.json
      STATE_DIR: /app/state
    volumes:
      - state-broker2:/app/state
      - ./config.json:/app/config.json:ro
    networks:
      - ormuz-net
    ports:
      - "9082:9082"
    restart: on-failure

  # ── DRONES (PC 1) ─────────────────────────────────────────
  drone1:
    build:
      context: .
      dockerfile: Dockerfile.drone
    # Conecta no DNS interno do PC 1 e no IP físico do PC 2
    command: [
      "drone1", "172.16.201.14:9091", 
      "broker1:9081", "broker2:9082", 
      "172.16.201.13:9083", "172.16.201.13:9084", "172.16.201.13:9085"
    ]
    environment:
      CONFIG_PATH: /app/config.json
    volumes:
      - ./config.json:/app/config.json:ro
    networks:
      - ormuz-net
    ports:
      - "9091:9091"
    depends_on:
      - broker1
      - broker2
    restart: on-failure

  drone2:
    build:
      context: .
      dockerfile: Dockerfile.drone
    command: [
      "drone2", "172.16.201.14:9092", 
      "broker1:9081", "broker2:9082", 
      "172.16.201.13:9083", "172.16.201.13:9084", "172.16.201.13:9085"
    ]
    environment:
      CONFIG_PATH: /app/config.json
    volumes:
      - ./config.json:/app/config.json:ro
    networks:
      - ormuz-net
    ports:
      - "9092:9092"
    depends_on:
      - broker1
      - broker2
    restart: on-failure

  # ── SENSORES (PC 1) ───────────────────────────────────────
  # Sensores são de borda (Edge), só precisam falar com o broker local mais próximo
  sensor-s1a:
    build:
      context: .
      dockerfile: Dockerfile.sensor
    command: ["S1A", "setor-1", "broker1:9081"]
    environment:
      SENSOR_INTERVALO_MIN: "20"
      SENSOR_INTERVALO_MAX: "25"
    networks:
      - ormuz-net
    depends_on:
      - broker1
    restart: on-failure

  sensor-s1b:
    build:
      context: .
      dockerfile: Dockerfile.sensor
    command: ["S1B", "setor-1", "broker1:9081"]
    environment:
      SENSOR_INTERVALO_MIN: "10"
      SENSOR_INTERVALO_MAX: "15"
    networks:
      - ormuz-net
    depends_on:
      - broker1
    restart: on-failure

  sensor-s2a:
    build:
      context: .
      dockerfile: Dockerfile.sensor
    command: ["S2A", "setor-2", "broker2:9082"]
    environment:
      SENSOR_INTERVALO_MIN: "16"
      SENSOR_INTERVALO_MAX: "22"
    networks:
      - ormuz-net
    depends_on:
      - broker2
    restart: on-failure

  sensor-s2b:
    build:
      context: .
      dockerfile: Dockerfile.sensor
    command: ["S2B", "setor-2", "broker2:9082"]
    environment:
      SENSOR_INTERVALO_MIN: "10"
      SENSOR_INTERVALO_MAX: "15"
    networks:
      - ormuz-net
    depends_on:
      - broker2
    restart: on-failure

  # ── FERRAMENTA DE DIAGNÓSTICO (PC 1) ──────────────────────
  tester:
    build:
      context: .
      dockerfile: Dockerfile.tester
    command: [
      "broker1:9081", "broker2:9082", 
      "172.16.201.13:9083", "172.16.201.13:9084", "172.16.201.13:9085"
    ]
    networks:
      - ormuz-net
    depends_on:
      - broker1
      - broker2
    stdin_open: true
    tty: true